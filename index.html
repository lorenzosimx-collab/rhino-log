<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhino Log</title>
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rhino Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna unica, header fisso col giorno, lista esercizi, barra di salvataggio in basso. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef1;
  --fg:#16191f; --fg-dim:#5d6572; --fg-faint:#8e97a4;
  --line:#dde0e6; --line-soft:#e8eaef;
  --accent:#2d6cdf;
  --push:#2563eb; --pull:#059669; --legs:#ea580c; --upper:#7c3aed;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --ok-bg:#dcfce7; --warn-bg:#ffedd5; --bad-bg:#fee2e2;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c23; --surface-2:#21262f;
  --fg:#eef1f5; --fg-dim:#9aa3b1; --fg-faint:#6d7684;
  --line:#2b313b; --line-soft:#232932;
  --accent:#6ea0f5;
  --push:#60a5fa; --pull:#34d399; --legs:#fb923c; --upper:#c084fc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --ok-bg:#14321f; --warn-bg:#3a2a10; --bad-bg:#3d1a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c23; --surface-2:#21262f;
  --fg:#eef1f5; --fg-dim:#9aa3b1; --fg-faint:#6d7684;
  --line:#2b313b; --line-soft:#232932;
  --accent:#6ea0f5;
  --push:#60a5fa; --pull:#34d399; --legs:#fb923c; --upper:#c084fc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --ok-bg:#14321f; --warn-bg:#3a2a10; --bad-bg:#3d1a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:15px; line-height:1.45;
  margin:0; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
input{font:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.hrow{display:flex; align-items:center; gap:10px; padding:10px 16px 8px;}
.brand{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.2px; flex:1 1 auto; min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--fg-faint);letter-spacing:.3px;text-transform:uppercase}
.unit{display:flex; gap:0; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--surface-2)}
.unit button{font-size:11px; font-weight:800; letter-spacing:.3px; padding:3px 9px; border:0; background:transparent; color:var(--fg-faint)}
.unit button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.autos{max-width:560px; margin:4px auto 0; font-size:11px; font-weight:600; color:var(--fg-faint); text-align:right}
.autos.ok{color:var(--ok)}
.autos.warn{color:var(--warn)}
.rescue{margin:0 16px 12px; padding:12px 13px; border-radius:12px; background:var(--warn-bg); border:1px solid transparent}
.rescue h3{margin:0 0 3px; font-family:var(--display); font-size:14px; color:var(--warn)}
.rescue p{margin:0 0 9px; font-size:12px; line-height:1.45; color:var(--fg-dim)}
.rescue .row{display:flex; gap:7px; align-items:center; margin-top:7px; flex-wrap:wrap}
.rescue .what{flex:1; font-size:12.5px; font-weight:700; min-width:120px}
.rescue button{font-size:12px; font-weight:700; padding:7px 11px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--fg)}
.rescue button.go{background:var(--warn); border-color:var(--warn); color:#fff}
.sync{font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; background:var(--surface-2); color:var(--fg-dim); white-space:nowrap}
.sync.on{background:var(--ok-bg); color:var(--ok)}
.sync.off{background:var(--warn-bg); color:var(--warn)}

.days{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; padding:0 16px 10px}
.day{
  border:1px solid var(--line); background:var(--surface); border-radius:9px;
  padding:7px 2px 8px; text-align:center; cursor:pointer; min-width:0;
}
.day b{display:block; font-family:var(--display); font-weight:800; font-size:11.5px; white-space:nowrap; letter-spacing:-.1px}
.day.sel{border-color:var(--dc); background:var(--dc); color:#fff}
.day.done::after{content:"●"; font-size:7px; color:var(--ok); display:block; line-height:1; margin-top:2px}
.day.sel.done::after{color:#fff}

/* ---------- wrap ---------- */
main{padding:0 16px; padding-block:14px 108px; max-width:560px; margin:0 auto}
.sec{margin-bottom:14px}
.sect{
  font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--fg-faint); margin:0 0 7px 2px;
}

/* ---------- card ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.card + .card{margin-top:8px}

/* feedback */
.fb{padding:12px 13px}
.fbgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px}
.fbi{min-width:0}
.fbl{font-size:11px; font-weight:700; color:var(--fg-dim); margin-bottom:4px; letter-spacing:.2px}
.pick{display:flex; gap:3px}
.pick button{
  flex:1 1 0; min-width:0; border:1px solid var(--line); background:transparent;
  border-radius:6px; padding:6px 0; font-size:12.5px; font-weight:700; cursor:pointer;
  color:var(--fg-dim);
}
.pick button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.fbnote{font-size:11px; color:var(--fg-faint); margin-top:9px; line-height:1.4}

/* esercizio */
.ex{padding:11px 13px 12px; border-bottom:1px solid var(--line-soft)}
.ex:last-child{border-bottom:0}
.exh{display:flex; gap:9px; align-items:flex-start}
.num{
  flex:0 0 22px; height:22px; border-radius:6px; background:var(--dc); color:#fff;
  font-family:var(--display); font-weight:800; font-size:12px;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.exn{flex:1 1 auto; min-width:0}
.exname{font-weight:700; font-size:14.5px; line-height:1.25; letter-spacing:-.15px}
.pres{margin-top:3px; font-size:12.5px; color:var(--fg-dim); font-weight:600}
.pres b{color:var(--fg)}
.tag{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.4px; padding:1px 5px; border-radius:4px; margin-left:4px; vertical-align:1px}
.t-m{background:var(--fg); color:var(--bg)}
.t-new{background:var(--warn-bg); color:var(--warn)}
.t-r0{background:var(--ok-bg); color:var(--ok)}
.t-r1{background:var(--warn-bg); color:var(--warn)}
.t-r12{background:var(--bad-bg); color:var(--bad)}
.cue{margin-top:6px; font-size:12px; line-height:1.4; color:var(--fg-dim); background:var(--surface-2); padding:6px 8px; border-radius:7px}
.cue b{color:var(--fg)}
.cue.warn{background:var(--bad-bg); color:var(--bad)}
.cue.warn b{color:var(--bad)}

/* set rows */
.sets{margin-top:9px; display:flex; flex-direction:column; gap:6px}
.sr{display:flex; align-items:center; gap:6px}
.sl{flex:0 0 26px; font-size:10.5px; font-weight:700; color:var(--fg-faint); letter-spacing:.3px}
.fi{flex:1 1 0; min-width:0; position:relative}
.fi input{
  width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg);
  border-radius:8px; padding:9px 8px 9px 9px; font-size:16px; font-weight:600;
  font-variant-numeric:tabular-nums; -moz-appearance:textfield;
}
.fi input::-webkit-outer-spin-button,.fi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fi input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.fi u{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-size:10.5px; font-weight:700; color:var(--fg-faint); text-decoration:none; pointer-events:none;
}
.prev{font-size:11px; color:var(--fg-faint); margin-top:4px; font-variant-numeric:tabular-nums}
.prev b{color:var(--fg-dim); font-weight:700}

.conn{display:flex; align-items:center; gap:7px; margin-top:9px}
.connl{font-size:11px; font-weight:700; color:var(--fg-dim)}
.conn .pick{flex:1 1 auto; max-width:180px}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.barin{max-width:560px; margin:0 auto; display:flex; gap:9px; align-items:center}
.save{
  flex:1 1 auto; border:0; background:var(--accent); color:#fff;
  font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.1px;
  border-radius:10px; padding:13px 10px; cursor:pointer;
}
.save:disabled{opacity:.45; cursor:default}
.save.done{background:var(--ok)}
.ghost{
  border:1px solid var(--line); background:transparent; border-radius:10px;
  padding:13px 14px; font-weight:700; font-size:13px; cursor:pointer; color:var(--fg-dim);
}
.msg{font-size:11.5px; color:var(--fg-faint); text-align:center; margin-top:6px; min-height:14px}
.msg.err{color:var(--bad); font-weight:600}

/* storico */
.hrow2{display:flex; justify-content:space-between; gap:10px; padding:9px 13px; border-bottom:1px solid var(--line-soft); align-items:baseline}
.hrow2:last-child{border-bottom:0}
.hd{font-size:12.5px; color:var(--fg-dim); font-weight:600; flex:0 0 auto}
.hv{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; min-width:0}
.hv small{color:var(--fg-faint); font-weight:600}
.pill{display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:99px; margin-left:5px}

.empty{padding:26px 16px; text-align:center; color:var(--fg-faint); font-size:13px; line-height:1.55}
.empty b{display:block; color:var(--fg-dim); font-family:var(--display); font-size:15px; margin-bottom:5px}

.domsbox{background:var(--warn-bg); border:1px solid transparent; border-radius:12px; padding:12px 13px}
.domsbox .sect{color:var(--warn)}
.domsq{font-size:13px; font-weight:600; color:var(--warn); margin-bottom:9px; line-height:1.4}

.legend summary{padding:11px 13px; font-size:12.5px; font-weight:700; color:var(--fg-dim); cursor:pointer}
.legend dl{margin:0; padding:0 13px 12px; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; font-size:12px; line-height:1.4}
.legend dt{font-weight:700; white-space:nowrap}
.legend dt .tag{margin-left:0}
.legend dd{margin:0; color:var(--fg-dim)}
.note{margin-top:9px}
.note textarea{
  width:100%; min-height:38px; resize:none; overflow:hidden; display:block;
  border:1px dashed var(--line); background:transparent; color:var(--fg);
  border-radius:8px; padding:8px 9px; font:inherit; font-size:14px; line-height:1.4;
}
.note textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-style:solid; border-color:transparent; background:var(--bg)}
.note textarea::placeholder{color:var(--fg-faint)}
.timer{font-variant-numeric:tabular-nums; min-width:96px; white-space:nowrap}
.timer.run{border-color:var(--accent); color:var(--accent)}
.timer.end{color:var(--ok); border-color:var(--ok)}
.tabs{display:flex; gap:6px; padding:0 16px 10px}
.tab{flex:1 1 0; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 0; font-size:12.5px; font-weight:700; color:var(--fg-dim); cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- PWA: safe area, login ---------- */
body{padding-top:env(safe-area-inset-top,0px)}
.login{max-width:380px; margin:12vh auto 0; padding:0 16px}
.login h1{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.4px; margin:0 0 4px}
.login p{color:var(--fg-dim); font-size:13px; margin:0 0 18px}
.login label{display:block; font-size:11px; font-weight:700; color:var(--fg-dim); margin:12px 0 4px; letter-spacing:.2px}
.login input{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:9px; padding:11px 10px; font-size:16px}
.login input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.login .save{width:100%; margin-top:18px}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:11.5px; color:var(--fg-faint); padding:4px 2px 0}
.foot button{border:0; background:none; color:var(--fg-dim); font-weight:700; font-size:12px; cursor:pointer; padding:6px 0}
</style>
</head>
<body>
<div id="app" hidden>
<header>
  <div class="hrow">
    <div class="brand">Rhino Log<small id="meso">Mesocycle 2 · Volume</small></div>
    <div class="unit" id="unit" role="group" aria-label="Weight unit">
      <button data-unit="kg" aria-pressed="true">KG</button><button data-unit="lb" aria-pressed="false">LB</button>
    </div>
    <div class="sync" id="sync">connecting…</div>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-log" aria-pressed="true">Workout</button>
    <button class="tab" id="tab-hist" aria-pressed="false">History</button>
  </div>
  <div class="days" id="days"></div>
</header>

<div id="rescue" class="rescue" hidden></div>

<main>
  <div id="view-log"></div>
  <div id="view-hist" hidden></div>
</main>

<div class="bar" id="bar">
  <div class="barin">
    <button class="ghost" id="btn-clear">Clear</button>
    <button class="ghost timer" id="btn-timer">▶ Start</button>
    <button class="save" id="btn-save">Save session</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="autos" id="autos"></div>
</div>
</div>

<form class="login" id="login" hidden>
  <h1>Rhino Log</h1>
  <p>Sign in once: this phone stays signed in.</p>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button class="save" type="submit" id="btn-login">Sign in</button>
  <div class="msg" id="lmsg"></div>
</form>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
"use strict";

/* ============ PROGRAM — plan v4.2, mesocycle 1 (week 2, revised 16/10/2026) ============
   Keys (k) are database ids: never rename them, only the visible text. */
const DAYS = [
  {k:"push", label:"PUSH", color:"var(--push)", warm:"Cable external rotations 2 × 12-15, light", ex:[
    {k:"peckfly",   n:"Pec deck fly",                 s:3, r:"8-12",  rir:"0",   rest:"90s",  cue:"Hands <b>never past</b> the torso line. 50×15 with reps to spare → <b>+1 step</b>"},
    {k:"panca",     n:"Smith machine incline press, 20° bench", s:3, r:"6-10", rir:"1-2", rest:"2min", cue:"On the Smith you feel the chest far more than on the flat bench (27/10). Plates only: 50 here is not 60 of barbell bench"},
    {k:"crosslat",  n:"Cable cross lateral raise",    s:3, r:"10-15", rir:"0",   rest:"90s",  cue:"<b>Stay below shoulder height.</b> No swinging. 11×15 → <b>+1 step</b>"},
    {k:"revfly",    n:"Reverse cable fly (rear delt)", s:3, r:"12-15", rir:"0",  rest:"90s",
     cue:"<b>Rear delt — the only weak part of the shoulder.</b> Cables crossed, pulley at shoulder height, elbow fixed and level with the shoulder · <b>short range</b>, stop at the line of the shoulders · don't squeeze the shoulder blades",
     warn:"At 14 kg the traps join in, at 11 they don't (27/10): stay at 11"},
    {k:"lorenzo",   n:"Lorenzo press (triceps, lengthened)", s:3, r:"8-11", rir:"0", rest:"90s", cue:"Cable at ear height behind you, elbow in front at shoulder level. Triceps in the <b>lengthened</b> position"},
    {k:"pushdown",  n:"Cable triceps pushdown (shortened)", s:3, r:"9-13", rir:"0", rest:"90s",
     cue:"Elbows at your sides, shoulder neutral. The pair to the Lorenzo press: that one loads the stretch, this one the squeeze. 46-50 kg at conn 3 (27/10)"}
  ]},
  {k:"pull", label:"PULL", color:"var(--pull)", ex:[
    {k:"pullover",  n:"Cable pullover (high pulley)", s:2, r:"10-15", rir:"0", rest:"90s", m:true,
     cue:'<b>Elbow stays fixed and almost straight</b> — if you feel the triceps you are bending it, and it becomes a pushdown. Only the shoulder moves. "Superman", tempo 2-1-1',
     warn:"Don't start with the arms fully overhead: that is end range under load. Start lower. Stays at 2 sets until you feel the back"},
    {k:"pulldown",  n:"Lat pulldown, overhand grip",  s:3, r:"8-12",  rir:"0", rest:"90s", cue:"<b>Spread the shoulder blades without shrugging</b>, then drive the elbows out. Think rotation. Tempo 3-1-1"},
    {k:"csrow_v",   n:"Chest-supported row — neutral grip", s:3, r:"6-10", rir:"0", rest:"2min", cue:"Neutral (vertical) grip, chest on the pad. The heavy back exercise. Tempo 3-1-1"},
    {k:"tbar",      n:"Chest-supported T-bar row — overhand grip", s:3, r:"8-12", rir:"0", rest:"2min", cue:"Chest on the pad. Overhand grip = rear delts. Tempo 3-1-1"},
    {k:"curlcable", n:"Cable curl, arm behind the body (lengthened)", s:3, r:"8-12", rir:"0", rest:"90s", nw:true,
     cue:"Low pulley, <b>back to the machine</b>, one step forward: the arm hangs <b>behind</b> the torso, so the biceps starts lengthened. Elbow fixed, don't let it drift forward. Light load — at the cable the tension is constant, which is what stops the forearm taking over"},
    {k:"scott",     n:"Preacher curl (shortened)",    s:3, r:"8-12",  rir:"0", rest:"90s", cue:"Z-bar, both arms: on biceps there is no asymmetry to measure, so single-arm only costs time"},
    {k:"crunch",    n:"Cable crunch / bodyweight",    s:3, r:"10-15", rir:"0", rest:"60-90s", cue:"Bodyweight is fine (28/10, conn 3)"}
  ]},
  {k:"legsa", label:"LEGS A", color:"var(--legs)", warm:"Hip mobility 5 min: 90/90 seated 8 per side · half-kneeling hip flexor 30-40s per side · deep squat hold 30-60s", ex:[
    {k:"abduz",   n:"STANDING cable hip abduction", s:3, r:"10-15", rir:"1", rest:"90s",
     cue:"<b>The weak muscle: glute medius.</b> Neutral hip · toes turned slightly out · short range 30-40° · torso still. The standing leg works too — that is half the point",
     warn:"If the cable is taken: side-lying bodyweight, same short range"},
    {k:"legpress",n:"Single-leg horizontal leg press", s:3, r:"8-12", rir:"1-2", rest:"alternate + 45-60s", uni:true,
     cue:"The heavy one of the day, and the only single-leg exercise here. <b>Foot in line with the hip</b>, not centered · 3 s lowering · only the range you control. 32 kg felt easy at 15 reps → <b>+1 step</b>"},
    {k:"legext",  n:"Leg extension, BOTH legs",     s:3, r:"8-12",  rir:"1", rest:"90s", nw:true,
     cue:"Both legs here on purpose: single-leg your right stops because of the <b>hip</b>, not the quad, so the quad never gets the work. Two legs = stable pelvis = the quad is what fails"},
    {k:"legcurl", n:"Seated leg curl (hamstrings, lengthened)", s:3, r:"7-10", rir:"1", rest:"90s",
     cue:"<b>This replaces the Romanian deadlift.</b> Seated = hip bent = the hamstring starts lengthened, which is what the RDL was for — minus the lower back. 3 s lowering, back flat against the pad, stop the range where the pelvis starts to move"},
    {k:"hip",     n:"Hip thrust",                   s:3, r:"8-12",  rir:"1", rest:"2min", cue:"Glute in full shortening. 80 → 100 kg in a week: keep going"},
    {k:"calf",    n:"Calf raise on the leg press",   s:3, r:"7-11",  rir:"1", rest:"90s", cue:"On the horizontal leg press — there is no standing calf machine. Same station as exercise 2, no setup change. 73×15 → <b>+1 step</b>"}
  ]},
  {k:"upper", label:"UPPER", color:"var(--upper)", warm:"Cable external rotations 2 × 12-15, light", ex:[
    {k:"latuni",    n:"Single-arm lat pulldown",    s:3, r:"6-10",  rir:"0", rest:"2min", uni:true, cue:"Tempo 3-1-1. Symmetrical at 32 kg: keep it that way", warn:"Last reps: if the shoulder fatigues before the back, close the set"},
    {k:"csrow_o",   n:"Chest-supported row — overhand grip", s:3, r:"6-10", rir:"0", rest:"2min",
     cue:"Overhand, wide grip. Tempo 3-1-1. <b>Do not chase the stretch at the bottom</b> — you proved it yourself on 23/10: without it, no pain and more load"},
    {k:"chestpress",n:"Cable chest press",          s:3, r:"8-12",  rir:"0", rest:"2min", cue:"<b>Handles touch at the end</b>, even crossing over. Don't open too wide at the start — the form you were shown on 30/10, zero shoulder trouble"},
    {k:"lento",     n:"Smith machine shoulder press, 60-75° bench", s:3, r:"7-12", rir:"1-2", rest:"2min", cue:"Guided. 30×12 clean → <b>+1 step</b>. If it hurts: shorten the range, or it goes"},
    {k:"curlcable", n:"Cable curl, arm behind the body (lengthened)", s:2, r:"8-12", rir:"0", rest:"90s", cue:"Second weekly exposure, 2 sets: this is a recall, not the main work"},
    {k:"lorenzo",   n:"Lorenzo press (triceps, lengthened)", s:2, r:"8-11", rir:"0", rest:"90s",
     cue:"Second weekly exposure, 2 sets", warn:"If the left shoulder complains in this position, swap it for the push down that day"}
  ]},
  {k:"legsb", label:"LEGS B", color:"var(--legs)", warm:"Hip mobility 5 min: 90/90 seated 8 per side · half-kneeling hip flexor 30-40s per side · deep squat hold 30-60s", ex:[
    {k:"abduz",   n:"STANDING cable hip abduction", s:3, r:"10-15", rir:"1", rest:"90s", cue:"Second exposure of the weak muscle. Same cues as Legs A"},
    {k:"legext",  n:"Leg extension, SINGLE leg",    s:2, r:"8-12",  rir:"1", rest:"alternate legs", m:true, uni:true,
     cue:"<b>The asymmetry test, not volume</b> — that is why it stays at 2 sets per leg. Log L and R separately. Note what stops you: the quad or the hip"},
    {k:"legcurl", n:"Seated leg curl (hamstrings, lengthened)", s:3, r:"7-10", rir:"1", rest:"90s", cue:"Second exposure. 3 s lowering, stop where the pelvis moves"},
    {k:"hip",     n:"Hip thrust",                   s:3, r:"8-12",  rir:"1", rest:"2min", cue:"Second exposure"},
    {k:"adduz",   n:"Hip adduction machine",        s:3, r:"10-15", rir:"1", rest:"90s", cue:"Chase the <b>feeling</b>, not the weight. 29.5×15 → <b>+1 step</b>"}
  ]}
];
const FB = [["voglia","Motivation"],["mood","Mood"],["energia","Energy"],["rpe","RPE"]];
const KNEE = [["nulla","None"],["lieve","Mild"],["presente","Present"]];


/* ============ stato ============ */
let sb=null, online=false, sessions=[], curDay=defaultDay(), tab="log", draft=null, saving=false;

function defaultDay(){
  const w=new Date().getDay(); // 0 dom
  return ({1:"push",2:"pull",4:"legsa",5:"upper",6:"legsb"})[w] || "push";
}
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function dayDef(k){ return DAYS.find(d=>d.k===k); }
/* Le sessioni fino al 29/10 sono salvate come "legs": la giornata non era ancora divisa.
   Per storico e "ultima volta" valgono come Legs A, così il confronto non parte da zero. */
function dayMatch(saved, k){ return saved===k || (k==="legsa" && saved==="legs"); }
function sid(date,day){ return date+"-"+day; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtD(iso){ const [y,m,d]=iso.split("-"); return d+"/"+m; }
function blank(day){ return {date:today(), day, feedback:{}, sonno:{}, ginocchio:"", exercises:{}, doms:null, note:"", startedAt:null, endedAt:null}; }

/* Tre livelli in localStorage, tutti per-telefono:
   draft.<id>  la sessione in corso, salvata a ogni tasto
   outbox      sessioni salvate offline, in attesa di arrivare al database
   cache       l'ultimo storico scaricato, per aprire l'app senza rete */
const LS="rhinolog.draft.", OUTBOX="rhinolog.outbox", CACHE="rhinolog.cache";
function lsGet(k,fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function loadDraft(day){
  const id=sid(today(),day);
  const local=lsGet(LS+id,null); if(local) return local;
  const queued=lsGet(OUTBOX,{})[id]; if(queued) return JSON.parse(JSON.stringify(queued));
  const saved=sessions.find(s=>s.id===id);
  if(saved) return JSON.parse(JSON.stringify(saved.body));
  return blank(day);
}
function saveDraft(){ lsSet(LS+sid(draft.date,draft.day), draft); }
function dropDraft(day){ lsDel(LS+sid(today(),day)); }

/* ============ render ============ */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML = DAYS.map(d=>{
    const done = sessions.some(s=>s.id===sid(today(),d.k));
    return `<button class="day${d.k===curDay?" sel":""}${done?" done":""}" data-day="${d.k}" style="--dc:${d.color}">
      <b>${d.label}</b></button>`;
  }).join("");
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ curDay=b.dataset.day; draft=loadDraft(curDay); render(); });
}

function prevFor(day, exKey){
  const id=sid(today(),day);
  const past=sessions.filter(s=>dayMatch(s.body.day,day) && s.id!==id);
  for(const s of past){ const e=s.body.exercises?.[exKey]; if(e&&e.sets?.some(x=>x&&(x.kg||x.reps))) return {date:s.body.date,e}; }
  return null;
}

function renderLog(){
  const d=dayDef(curDay);
  const pend=pendingDoms();
  let h=`<div style="--dc:${d.color}">`;

  if(pend){
    h+=`<div class="sec"><div class="card domsbox">
      <div class="sect">Yesterday · ${esc(pend.body.day.toUpperCase())}</div>

      <div class="pick" id="doms-pick">

      </div></div></div>`;
  }

  h+=`<div class="sec"><div class="sect">Before you start · 1-5</div><div class="card"><div class="fb">
    <div class="fbgrid">${FB.map(([k,l])=>`

      ${[1,2,3,4,5].map(v=>`<button data-v="${v}" aria-pressed="${draft.feedback[k]==v?"true":"false"}">${v}</button>`).join("")}
      </div></div>`).join("")}</div>
    <div class="fbnote"><b>Mood</b> = getting in the zone. <b>Energy</b> is something else. All high = recovery is there. <b>Not sure what to put?</b> Open the scoring guide below.</div>
  </div></div></div>`;

  h+=`<div class="sec"><details class="card legend"><summary>How to score motivation, mood, energy, RPE &amp; Conn.</summary><dl>
    <dt>When</dt><dd><b>Motivation</b> before you leave the house · <b>Mood</b> and <b>Energy</b> during the session · <b>RPE</b> at the end, looking back. Never leave one blank: an empty field is a hole in the data, not a neutral score.</dd>
    <dt>Motivation</dt><dd>The drive to go. <b>1</b> going only because it is in the calendar · <b>2</b> had to talk myself into it · <b>3</b> neutral, I go · <b>4</b> happy to go · <b>5</b> wanted it since the morning.</dd>
    <dt>Mood</dt><dd>Getting in the zone — the head inside the sets. <b>1</b> elsewhere, distracted, the phone wins · <b>2</b> I start the set and drift off · <b>3</b> focused in patches · <b>4</b> focused almost throughout · <b>5</b> in the zone, only you and the machine exist.</dd>
    <dt>Energy</dt><dd>Physical fuel, independent of the two above. <b>1</b> empty, the stairs are heavy · <b>2</b> flat · <b>3</b> normal · <b>4</b> full · <b>5</b> loaded, could do another session.</dd>
    <dt>RPE</dt><dd><b>Not how hard a set felt</b> — that is RIR, logged per exercise. This is one score for the whole session: <b>how much of what you had you actually expressed</b>. <b>1</b> expressed nothing, write-off · <b>2</b> below my standard · <b>3</b> did what I had to · <b>4</b> good, above average · <b>5</b> full session, gave everything I had.</dd>
    <dt>RPE vs RIR</dt><dd>RIR = reps left in the tank on <i>that</i> set (it is in the plan: RIR 0, RIR 1-2). RPE = the verdict on the <i>session</i>. They are not the same thing, do not copy one into the other.</dd>
    <dt>The link</dt><dd>Your RPE drops when the <b>mood</b> drops, not when the energy drops. All the energy in the world and no focus = no intensity expressed. That is why both are logged.</dd>
    <dt>Conn. 1-3</dt><dd>How much you felt <b>the target muscle</b> — not pain, not fatigue, not a generic burn. <b>1</b> did not feel it: other muscles did the set · <b>2</b> in patches: the first reps only, or one point of the range · <b>3</b> from the first rep to the last, and you know exactly where you worked.</dd>
    <dt>Conn. test</dt><dd>If by the evening you cannot say which muscle did that exercise, it was a <b>1</b> — even if you sweated.</dd>
    <dt>Why Conn.</dt><dd>It is the main goal of this block. Weights flat + Conn. going up <b>is progress</b>, not a plateau. Slowing the tempo down is the most direct way to start feeling a muscle you do not feel.</dd>
  </dl></details></div>`;

  if(d.warm) h+=`<div class="sec"><div class="card"><div class="ex"><div class="cue" style="margin:0">
    <b>Warm-up</b> · ${esc(d.warm)}</div></div></div></div>`;

  h+=`<div class="sec"><details class="card legend"><summary>How to read this plan</summary><dl>
    <dt>2 × 8-12</dt><dd>Working sets × rep range. Warm-up sets not counted.</dd>
    <dt><span class="tag t-r0">RIR 0</span></dt><dd>Reps in reserve. 0 = to technical failure; 1-2 = stop 1-2 reps short (free weights, or loads on shoulder/knee).</dd>
    <dt><span class="tag t-m">M</span></dt><dd>Benchmark set: set 1 keeps the same weight, reps and tempo for the whole block. The goal is better quality, not more weight.</dd>
    <dt><span class="tag t-new">NEW</span></dt><dd>New exercise: first 2-3 sessions are for finding the weight and the feel.</dd>
    <dt>Tempo 3-1-1</dt><dd>Seconds: lowering · pause · lifting.</dd>
    <dt>L / R</dt><dd>Single-limb exercise: left and right logged separately (tracking a knee asymmetry).</dd>
    <dt>Superset</dt><dd>Done back to back with the next exercise, rest after the pair.</dd>
    <dt>Conn. 1-3</dt><dd>Mind-muscle connection with the target muscle. The main goal of this block, more than the weights.</dd>
  </dl></details></div>`;

  h+=`<div class="sec"><div class="sect">${d.label} · ${d.ex.length} exercises</div><div class="card">`;
  d.ex.forEach((x,i)=>{
    const st=draft.exercises[x.k]||{sets:[],conn:null};
    const pv=prevFor(curDay,x.k);
    const rirCls = x.rir==="0"?"t-r0":(x.rir==="1"?"t-r1":"t-r12");
    h+=`<div class="ex">
      <div class="exh"><div class="num">${i+1}</div><div class="exn">
        <div class="exname">${esc(x.n)}${x.m?'<span class="tag t-m">M</span>':""}${x.nw?'<span class="tag t-new">NEW</span>':""}</div>
        <div class="pres"><b>${x.s}${x.uni?" /leg":""} × ${x.r}</b> <span class="tag ${rirCls}">RIR ${x.rir}</span> <span style="color:var(--fg-faint)">${esc(x.rest)}</span></div>
      </div></div>
      ${x.cue?`<div class="cue">${x.cue}</div>`:""}
      ${x.warn?`<div class="cue warn"><b>${esc(x.warn)}</b></div>`:""}
      <div class="sets">`;
    for(let s=0;s<x.s;s++){
      const v=st.sets[s]||{};
      if(x.uni){
        h+=`<div class="sr"><div class="sl">${s+1} L</div>
          ${numIn(x.k,s,"kg","kg",v.kg)}${numIn(x.k,s,"reps","reps",v.reps)}</div>
          <div class="sr"><div class="sl">${s+1} R</div>
          ${numIn(x.k,s,"kg2","kg",v.kg2)}${numIn(x.k,s,"reps2","reps",v.reps2)}</div>`;
      }else{
        h+=`<div class="sr"><div class="sl">${s+1}</div>
          ${numIn(x.k,s,"kg","kg",v.kg)}${numIn(x.k,s,"reps","reps",v.reps)}</div>`;
      }
    }
    h+=`</div>`;
    if(pv){
      const txt=pv.e.sets.filter(Boolean).map(z=> x.uni
        ? `${fmtW(z.kg)}×${z.reps??"–"} / ${fmtW(z.kg2)}×${z.reps2??"–"}`
        : `${fmtW(z.kg)}×${z.reps??"–"}`).join("  ·  ");
      h+=`<div class="prev"><b>${fmtD(pv.date)}</b> &nbsp;${esc(txt)}${pv.e.conn?`  ·  conn ${pv.e.conn}`:""}</div>`;
    }
    h+=`<div class="conn"><div class="connl">Conn.</div><div class="pick" data-conn="${x.k}">
      ${[1,2,3].map(v=>`<button data-v="${v}" aria-pressed="${st.conn==v?"true":"false"}">${v}</button>`).join("")}
    </div></div>
    <div class="note"><textarea data-note="${x.k}" rows="1" placeholder="Notes: what you feel, what happens…">${esc(st.note||"")}</textarea></div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="sec"><div class="sect">Outside the gym</div><div class="card"><div class="fb">
    <div class="fbgrid">
      <div class="fbi"><div class="fbl">Hours of sleep</div>${plainIn("sonno.ore","e.g. 8",draft.sonno.ore)}</div>
      <div class="fbi"><div class="fbl">Night wakings</div>${plainIn("sonno.risvegli","e.g. 3",draft.sonno.risvegli)}</div>
    </div>
    <div class="fbl" style="margin-top:11px">Knee today (stairs / running)</div>
    <div class="pick" data-gin="1">${KNEE.map(([v,l])=>
      `<button data-v="${v}" aria-pressed="${draft.ginocchio===v?"true":"false"}">${l}</button>`).join("")}</div>
  </div></div></div>`;

  h+=`<div class="sec"><div class="sect">Session notes</div><div class="card"><div class="fb note" style="margin:0">
    <textarea data-snote="1" rows="2" placeholder="How the session went overall: gym crowded, short on time, pain, anything off…">${esc(draft.note||"")}</textarea>
  </div></div></div>`;

  h+=`</div>`;
  document.getElementById("view-log").innerHTML=h;

/* ---------- unita' di peso ----------
   Nel database i carichi stanno SEMPRE in kg (colonna numeric(5,1)): l'unita' e' solo
   come li scrivi e come li leggi, e vale per questo telefono. Le libbre si convertono
   in kg in ingresso e si riconvertono in uscita; l'arrotondamento a un decimale sul kg
   fa tornare il numero della macchina (90 lb -> 40,8 kg -> 90 lb). */
const UNITK="rhinolog.unit", LBxKG=2.2046226218;
let wunit = lsGet(UNITK,"kg")==="lb" ? "lb" : "kg";
function toUnit(kg){ return kg==null ? null : (wunit==="lb" ? kg*LBxKG : kg); }
function fromUnit(v){ return v==null ? null : Math.round((wunit==="lb" ? v/LBxKG : v)*10)/10; }
/* Il numero come va mostrato. In libbre si arrotonda al mezzo chilo di libbra: il kg nel
   database ha un solo decimale, quindi la riconversione sbaglia al massimo di 0,11 lb, e
   i dischi sono comunque multipli di 2,5 lb — cosi' 2,5 lb restano 2,5 e non 2,4. */
function dispW(kg){
  let v=toUnit(kg);
  if(v==null || Number.isNaN(v)) return "";
  if(wunit==="lb"){ v=Math.round(v*2)/2; return Number.isInteger(v)?String(v):v.toFixed(1); }
  return Math.abs(v-Math.round(v))<0.2 ? String(Math.round(v)) : (Math.round(v*10)/10).toFixed(1);
}
function fmtW(kg){ const t=dispW(kg); return t===""?"–":t; }
function setUnit(u){
  wunit = u==="lb" ? "lb" : "kg";
  try{ localStorage.setItem(UNITK, wunit); }catch(e){}
  paintUnit(); render();
}
function paintUnit(){
  document.querySelectorAll("#unit [data-unit]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.unit===wunit)));
}
document.querySelectorAll("#unit [data-unit]").forEach(b=>
  b.onclick=()=>setUnit(b.dataset.unit));

function numIn(ex,s,f,unit,val){
  const w = f.indexOf("kg")===0;
  const lab = w ? wunit : unit;
  const v = w ? dispW(val) : (val??"");
  const step = w ? (wunit==="lb" ? "1" : "0.5") : "1";
  return `<div class="fi"><input type="number" inputmode="decimal" step="${step}" min="0"
    data-ex="${ex}" data-s="${s}" data-f="${f}" value="${v}" aria-label="${lab}"><u>${lab}</u></div>`;
}
function plainIn(path,ph,val){
  return `<div class="fi"><input type="number" inputmode="numeric" min="0" data-path="${path}" placeholder="${ph}" value="${val??""}"></div>`;
}

function wireLog(){
  const v=document.getElementById("view-log");
  v.querySelectorAll("input[data-ex]").forEach(i=>{
    i.oninput=()=>{
      const {ex,s,f}=i.dataset;
      draft.exercises[ex] = draft.exercises[ex] || {sets:[],conn:null};
      const arr=draft.exercises[ex].sets;
      arr[+s]=arr[+s]||{};
      arr[+s][f] = i.value==="" ? undefined
        : (f.indexOf("kg")===0 ? fromUnit(Number(i.value)) : Number(i.value));
      saveDraft(); markDirty();
    };
  });
  v.querySelectorAll("textarea").forEach(ta=>{
    grow(ta);
    ta.oninput=()=>{
      grow(ta);
      if(ta.dataset.note){ const k=ta.dataset.note;
        draft.exercises[k]=draft.exercises[k]||{sets:[],conn:null}; draft.exercises[k].note=ta.value; }
      else draft.note=ta.value;
      saveDraft(); markDirty();
    };
  });
  v.querySelectorAll("input[data-path]").forEach(i=>{
    i.oninput=()=>{ const [a,b]=i.dataset.path.split("."); draft[a][b]= i.value===""?undefined:Number(i.value); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-fb] button").forEach(b=>{
    b.onclick=()=>{ const k=b.closest("[data-fb]").dataset.fb; draft.feedback[k]=+b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-conn] button").forEach(b=>{
    b.onclick=()=>{ const k=b.closest("[data-conn]").dataset.conn;
      draft.exercises[k]=draft.exercises[k]||{sets:[],conn:null}; draft.exercises[k].conn=+b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-gin] button").forEach(b=>{
    b.onclick=()=>{ draft.ginocchio=b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); saveDraft(); markDirty(); };
  });
  const dp=v.querySelector("#doms-pick");
  if(dp) dp.querySelectorAll("button").forEach(b=>{
    b.onclick=async()=>{
      const p=pendingDoms(); if(!p||!sb) return;
      dp.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      const {error}=await sb.from("rhino_sessions").update({doms_grado:+b.dataset.doms, doms_at:today()}).eq("id",p.uuid);
      if(error) msg("DOMS not saved: "+(isNetErr(error)?"you are offline":error.message), true); else sync();
    };
  });
}

function pendingDoms(){
  const ys=iso(new Date(Date.now()-86400000));
  return sessions.find(s=>s.uuid && s.body.date===ys && !s.body.doms) || null;
}

/* ---------- storico ---------- */
function renderHist(){
  const el=document.getElementById("view-hist");
  if(!sessions.length){
    el.innerHTML=`<div class="card"><div class="empty"><b>No sessions yet</b>
      Save your first workout and you'll see how weights and connection change over time.</div></div>`;
    return;
  }
  const d=dayDef(curDay);
  const mine=sessions.filter(s=>dayMatch(s.body.day,curDay)).slice(0,12);
  let h=`<div class="sec"><div class="sect">${d.label} · last ${mine.length} sessions</div><div class="card">`;
  if(!mine.length){ h+=`<div class="empty">No <b style="display:inline">${d.label}</b> sessions yet.</div>`; }
  mine.forEach(s=>{
    const f=s.body.feedback||{};
    const vals=Object.values(s.body.exercises||{});
    const conns=vals.map(e=>e.conn).filter(Boolean);
    const avgC=conns.length?(conns.reduce((a,b)=>a+b,0)/conns.length).toFixed(1):"–";
    const fbv=[f.voglia,f.mood,f.energia,f.rpe].filter(Boolean);
    const avgF=fbv.length?(fbv.reduce((a,b)=>a+b,0)/fbv.length).toFixed(1):"–";
    const col=avgF>=4?"var(--ok)":(avgF>=3?"var(--warn)":"var(--bad)");
    const dur=s.body.durationMin!=null?` <small>· ${Math.round(s.body.durationMin)}′</small>`:"";
    h+=`<div class="hrow2"><div class="hd">${fmtD(s.body.date)}${dur}</div>
      <div class="hv">conn <b>${avgC}</b> <small>· recovery</small> <span style="color:${col}">${avgF}</span>
      ${s.body.doms?`<span class="pill" style="background:var(--surface-2);color:var(--fg-dim)">DOMS ${s.body.doms.grado}</span>`:""}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="sec"><div class="sect">Progress by exercise · top set</div><div class="card">`;
  d.ex.forEach(x=>{
    const pts=sessions.filter(s=>dayMatch(s.body.day,curDay)).map(s=>({d:s.body.date,e:s.body.exercises?.[x.k]}))
      .filter(p=>p.e&&p.e.sets?.some(z=>z&&z.kg)).slice(0,5).reverse();
    const txt = pts.length
      ? pts.map(p=>{ const best=Math.max(...p.e.sets.filter(z=>z&&z.kg).map(z=>z.kg)); return dispW(best); }).join(" → ")+" "+wunit
      : "<small>no data</small>";
    h+=`<div class="hrow2"><div class="hd" style="flex:1 1 auto;min-width:0">${esc(x.n)}</div>
      <div class="hv">${txt}</div></div>`;
  });
  h+=`</div></div>`;
  el.innerHTML=h;
}


/* ============ database (Supabase) ============ */
const SEL="id,date,day,voglia,mood,energia,rpe,sonno_ore,risvegli,ginocchio,doms_grado,doms_at,deload,note,saved_at,started_at,ended_at,duration_min,"+
          "rhino_exercises(exercise,conn,note),rhino_sets(exercise,set_no,side,kg,reps)";

/* riga Supabase → stessa forma della sessione che usa l'interfaccia */
function fromRow(r){
  const ex={};
  const get=k=>ex[k]=ex[k]||{sets:[],conn:null};
  (r.rhino_exercises||[]).forEach(e=>{ const o=get(e.exercise); o.conn=e.conn; if(e.note) o.note=e.note; });
  (r.rhino_sets||[]).forEach(s=>{
    const o=get(s.exercise), i=s.set_no-1, z=o.sets[i]=o.sets[i]||{};
    const kg=s.kg==null?undefined:Number(s.kg), reps=s.reps==null?undefined:s.reps;
    if(s.side==="dx"){ z.kg2=kg; z.reps2=reps; } else { z.kg=kg; z.reps=reps; }
  });
  const nn=v=>v==null?undefined:Number(v);
  return {id:sid(r.date,r.day), uuid:r.id, body:{
    date:r.date, day:r.day,
    feedback:{voglia:nn(r.voglia), mood:nn(r.mood), energia:nn(r.energia), rpe:nn(r.rpe)},
    sonno:{ore:nn(r.sonno_ore), risvegli:nn(r.risvegli)},
    ginocchio:r.ginocchio||"", exercises:ex,
    doms:r.doms_grado==null?null:{grado:r.doms_grado, at:r.doms_at},
    deload:!!r.deload, note:r.note||"", savedAt:r.saved_at,
    startedAt:r.started_at||null, endedAt:r.ended_at||null, durationMin:r.duration_min==null?null:Number(r.duration_min)
  }};
}

/* negli unilaterali manda sempre kg2/reps2 (anche null): la funzione SQL distingue SX/DX così */
function toPayload(d){
  const p=JSON.parse(JSON.stringify(d));
  const def=dayDef(p.day);
  for(const [k,e] of Object.entries(p.exercises||{})){
    const uni=def.ex.find(x=>x.k===k)?.uni;
    e.sets=(e.sets||[]).map(z=>{
      z=z||{};
      const o={kg:z.kg??null, reps:z.reps??null};
      if(uni){ o.kg2=z.kg2??null; o.reps2=z.reps2??null; }
      return o;
    });
  }
  return p;
}

async function fetchSessions(){
  const {data,error}=await sb.from("rhino_sessions").select(SEL).order("date",{ascending:false}).limit(200);
  if(error) throw error;
  sessions=data.map(fromRow);
  lsSet(CACHE, sessions);
}

async function pushSession(body){
  const {error}=await sb.rpc("rhino_save_session",{p:toPayload(body)});
  if(error) throw error;
}

/* svuota la coda offline; ritorna quante sessioni restano */
async function flushOutbox(){
  const box=lsGet(OUTBOX,{});
  for(const [id,body] of Object.entries(box)){
    try{ await pushSession(body); delete box[id]; lsSet(OUTBOX,box); }
    catch(e){ if(isNetErr(e)) break; else { delete box[id]; lsSet(OUTBOX,box); msg("A queued session was rejected: "+(e.message||"error"), true); } }
  }
  return Object.keys(lsGet(OUTBOX,{})).length;
}

function isNetErr(e){
  const m=String(e&&(e.message||e)||"");
  return !navigator.onLine || /fetch|network|Load failed|timeout/i.test(m);
}

function setSync(state, extra){
  const sy=document.getElementById("sync");
  const q=Object.keys(lsGet(OUTBOX,{})).length;
  const txt={on:"synced", off:"offline", err:"error", wait:"connecting…"}[state];
  sy.textContent = txt + (q?` · ${q} queued`:"") + (extra||"");
  sy.className = "sync" + (state==="on"&&!q?" on":(state==="wait"?"":" off"));
}

async function sync(){
  if(!sb) return;
  try{
    await flushOutbox();
    await fetchSessions();
    online=true; setSync("on");
  }catch(e){
    online=false; setSync(isNetErr(e)?"off":"err");
  }
  const id=sid(today(),curDay);
  if(!lsGet(LS+id,null)) draft=loadDraft(curDay);
  render();
}

/* ---------- comune ---------- */
function grow(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }
function render(){
  paintUnit();
  renderDays();
  document.getElementById("view-log").hidden = tab!=="log";
  document.getElementById("view-hist").hidden = tab!=="hist";
  document.getElementById("bar").hidden = tab!=="log";
  if(tab==="log") renderLog(); else { renderHist(); renderFoot(); }
  refreshSave(); paintTimer(); paintAuto(); paintRescue();
}
function renderFoot(){
  const el=document.getElementById("view-hist");
  const f=document.createElement("div"); f.className="foot";
  f.innerHTML=`<span>${esc(sbUserEmail||"")}</span><button id="btn-out">Sign out</button>`;
  el.appendChild(f);
  f.querySelector("#btn-out").onclick=async()=>{
    if(!confirm("Sign out? Drafts and queued sessions stay on this phone.")) return;
    await sb.auth.signOut(); location.reload();
  };
}
function hasData(body){
  return Object.values(body?.exercises||{}).some(e=>e.conn || e.note?.trim() || e.sets?.some(s=>s&&(s.kg||s.reps)));
}
function filled(){ return hasData(draft); }
function markDirty(){ refreshSave(); scheduleAuto(); }
function refreshSave(){
  const b=document.getElementById("btn-save");
  const id=sid(draft.date,draft.day);
  const saved = sessions.some(s=>s.id===id) || !!lsGet(OUTBOX,{})[id];
  b.disabled = saving || !filled();
  b.textContent = saving ? "Saving…" : (saved ? "Update session" : "Save session");
  b.classList.toggle("done", saved && !saving);
}
function msg(t,err){ const m=document.getElementById("msg"); m.textContent=t||""; m.classList.toggle("err",!!err); }

async function saveSession(){
  if(saving) return;
  clearTimeout(autoT); clearTimeout(autoRetryT);
  saving=true; refreshSave(); msg("");
  const tm=getTimer();
  if(tm){ draft.startedAt=tm.start; draft.endedAt=tm.end||new Date().toISOString(); saveDraft(); }
  const body=JSON.parse(JSON.stringify(draft));
  body.savedAt=new Date().toISOString();
  const id=sid(body.date,body.day);
  try{
    await pushSession(body);
    dropDraft(body.day);
    autoAt=new Date(); autoErr=false;
    msg("Saved to the database.");
    await sync();
  }catch(e){
    if(isNetErr(e)){
      const box=lsGet(OUTBOX,{}); box[id]=body; lsSet(OUTBOX,box);
      dropDraft(body.day);
      msg("You're offline: saved on this phone, it will upload by itself when you're back online.");
      setSync("off");
    }else{
      msg("Not saved ("+(e.message||"error")+"). Your data stays on this phone.", true);
    }
  }
  saving=false; refreshSave();
}
document.getElementById("btn-save").onclick=saveSession;

/* ---------- salvataggio automatico ----------
   Il tasto Salva resta, ma non serve ricordarselo: ogni modifica programma una scrittura
   nel database dopo 4 secondi di pausa, e la RPC e' un upsert su (utente, data, giorno),
   quindi riscrivere la stessa sessione non crea duplicati. La bozza locale NON viene
   cancellata: resta la copia di lavoro, cosi' si continua a scrivere senza aspettare la rete. */
const AUTO_MS=4000, AUTO_RETRY_MS=30000;
let autoT=null, autoRetryT=null, autoSaving=false, autoAt=null, autoErr=false;

function scheduleAuto(){
  clearTimeout(autoT);
  if(!hasData(draft)) return;
  autoT=setTimeout(doAuto, AUTO_MS);
  paintAuto();
}
async function doAuto(){
  clearTimeout(autoT); clearTimeout(autoRetryT);
  if(autoSaving || saving || !sb || !hasData(draft)) return;
  autoSaving=true; paintAuto();
  const tm=getTimer();
  if(tm){ draft.startedAt=tm.start; draft.endedAt=tm.end||new Date().toISOString(); saveDraft(); }
  const body=JSON.parse(JSON.stringify(draft));
  body.savedAt=new Date().toISOString();
  try{
    await pushSession(body);
    autoAt=new Date(); autoErr=false;
    try{ await fetchSessions(); }catch(e){}
  }catch(e){
    autoErr=true;
    autoRetryT=setTimeout(doAuto, AUTO_RETRY_MS);
  }
  autoSaving=false; paintAuto(); refreshSave();
}
function paintAuto(){
  const el=document.getElementById("autos"); if(!el) return;
  const id=sid(draft.date,draft.day);
  const inDb=sessions.some(s=>s.id===id);
  let t="", cls="";
  if(!hasData(draft)) t="";
  else if(autoSaving) t="saving\u2026";
  else if(autoErr) t=inDb ? "saved \u00b7 last change not uploaded yet" : "NOT saved yet \u2014 no connection, it will retry";
  else if(autoAt) t="saved automatically at "+autoAt.toTimeString().slice(0,5), cls="ok";
  else if(inDb) t="saved", cls="ok";
  else t="not saved yet", cls="warn";
  el.textContent=t; el.className="autos"+(cls?" "+cls:"");
}
/* app che va in background o si chiude: si scrive subito, senza aspettare i 4 secondi */
function flushAuto(){ if(hasData(draft) && !autoSaving) doAuto(); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushAuto(); });
window.addEventListener("pagehide", flushAuto);

/* ---------- bozze di giorni passati mai arrivate al database ----------
   La bozza e' indicizzata per data: quella di un giorno passato non viene piu' aperta
   dall'interfaccia e resterebbe invisibile nella memoria del telefono. Qui si recupera. */
function orphanDrafts(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k || !k.startsWith(LS)) continue;
      const id=k.slice(LS.length);
      const date=id.slice(0,10);
      if(date===today()) continue;
      const body=lsGet(k,null);
      if(!body || !hasData(body)) continue;
      out.push({key:k, id, date, day:body.day||id.slice(11), body});
    }
  }catch(e){}
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function paintRescue(){
  const el=document.getElementById("rescue"); if(!el) return;
  const list=orphanDrafts();
  el.hidden = list.length===0;
  if(!list.length){ el.innerHTML=""; return; }
  el.innerHTML = `<h3>${list.length===1?"A session was never saved":list.length+" sessions were never saved"}</h3>
    <p>You wrote these down but the Save button was never pressed, so they never reached the database. They are still on this phone.</p>` +
    list.map((o,i)=>`<div class="row"><span class="what">${esc(fmtD(o.date))} \u00b7 ${esc(String(o.day).toUpperCase())}</span>
      <button class="go" data-save="${i}">Save now</button>
      <button data-drop="${i}">Discard</button></div>`).join("");
  el.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{
    const o=list[Number(b.dataset.save)];
    b.disabled=true; b.textContent="Saving\u2026";
    const body=JSON.parse(JSON.stringify(o.body));
    body.savedAt=new Date().toISOString();
    try{
      await pushSession(body);
      lsDel(o.key);
      msg("Session of "+fmtD(o.date)+" saved to the database.");
      await sync();
    }catch(e){
      b.disabled=false; b.textContent="Save now";
      msg(isNetErr(e) ? "You're offline: connect and try again, the session stays on this phone."
                      : "Not saved ("+(e.message||"error")+"). It stays on this phone.", true);
    }
  });
  el.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{
    const o=list[Number(b.dataset.drop)];
    if(!confirm("Discard the session of "+fmtD(o.date)+" ("+String(o.day).toUpperCase()+")? It cannot be recovered.")) return;
    lsDel(o.key); paintRescue();
  });
}

/* ---------- timer durata sessione ----------
   Stato in localStorage per sessione: {start, end}; end null = in corso. Sopravvive a chiusura app e salvataggi.
   Ogni salvataggio manda startedAt/endedAt (endedAt = adesso se il timer gira ancora); Finish lo ferma. */
const TIMER="rhinolog.timer.";
function getTimer(){
  const id=sid(draft.date,draft.day);
  const t=lsGet(TIMER+id,null); if(t) return t;
  return draft.startedAt ? {start:draft.startedAt, end:draft.endedAt} : null;
}
function setTimer(t){ const id=sid(draft.date,draft.day); if(t) lsSet(TIMER+id,t); else lsDel(TIMER+id); paintTimer(); }
function fmtDur(ms){
  const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0");
}
function paintTimer(){
  const b=document.getElementById("btn-timer"); if(!b) return;
  const t=draft&&getTimer();
  b.classList.toggle("run", !!(t&&!t.end)); b.classList.toggle("end", !!(t&&t.end));
  if(!t) b.textContent="▶ Start";
  else if(!t.end) b.textContent="⏱ "+fmtDur(Date.now()-new Date(t.start));
  else b.textContent="✓ "+Math.round((new Date(t.end)-new Date(t.start))/60000)+" min";
}
document.getElementById("btn-timer").onclick=async()=>{
  const t=getTimer();
  if(!t){ setTimer({start:new Date().toISOString(), end:null}); msg("Timer started. Tap it again when you finish."); return; }
  if(!t.end){
    if(!confirm("Finish the session? Total time: "+fmtDur(Date.now()-new Date(t.start)))) return;
    setTimer({start:t.start, end:new Date().toISOString()});
    if(filled()) await saveSession(); else msg("Time recorded. It will be saved with the session.");
    return;
  }
  if(confirm("Resume the timer? The time since you finished will count.")) setTimer({start:t.start, end:null});
};
setInterval(()=>{ if(tab==="log") paintTimer(); }, 1000);
document.getElementById("btn-clear").onclick=()=>{
  dropDraft(curDay);
  lsDel(TIMER+sid(today(),curDay));
  draft=blank(curDay);
  render(); msg("Cleared (on this phone only, the saved session is untouched).");
};
document.getElementById("tab-log").onclick=()=>{tab="log";
  document.getElementById("tab-log").setAttribute("aria-pressed","true");
  document.getElementById("tab-hist").setAttribute("aria-pressed","false"); render();};
document.getElementById("tab-hist").onclick=()=>{tab="hist";
  document.getElementById("tab-hist").setAttribute("aria-pressed","true");
  document.getElementById("tab-log").setAttribute("aria-pressed","false"); render();};

/* ---------- avvio ---------- */
let sbUserEmail="";
function showApp(){ document.getElementById("login").hidden=true; document.getElementById("app").hidden=false; }
function showLogin(t){ document.getElementById("app").hidden=true; document.getElementById("login").hidden=false;
  document.getElementById("lmsg").textContent=t||""; }

document.getElementById("login").onsubmit=async ev=>{
  ev.preventDefault();
  const b=document.getElementById("btn-login"), lm=document.getElementById("lmsg");
  b.disabled=true; lm.textContent=""; lm.classList.remove("err");
  const {data,error}=await sb.auth.signInWithPassword({
    email:document.getElementById("em").value.trim(), password:document.getElementById("pw").value});
  b.disabled=false;
  if(error){ lm.textContent=error.message==="Invalid login credentials"?"Wrong email or password.":error.message; lm.classList.add("err"); return; }
  sbUserEmail=data.user?.email||"";
  showApp(); sync();
};

(async()=>{
  sessions=lsGet(CACHE,[]);
  draft=loadDraft(curDay);
  const cfg=window.RHINO_CONFIG;
  if(!cfg||!window.supabase){ showApp(); render(); setSync("err"," · config"); msg("Missing configuration (config.js).", true); return; }
  sb=window.supabase.createClient(cfg.url, cfg.anonKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"rhinolog.auth"}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  sbUserEmail=session.user?.email||"";
  showApp(); render(); setSync("wait");
  sync();
  window.addEventListener("online", sync);
  window.addEventListener("offline", ()=>setSync("off"));
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(); });
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
