<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhino Log</title>
<meta name="theme-color" content="#101318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rhino Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: colonna unica, header fisso col giorno, lista esercizi, barra di salvataggio in basso. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef1;
  --fg:#16191f; --fg-dim:#5d6572; --fg-faint:#8e97a4;
  --line:#dde0e6; --line-soft:#e8eaef;
  --accent:#2d6cdf;
  --push:#2563eb; --pull:#059669; --legs:#ea580c; --upper:#7c3aed;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --ok-bg:#dcfce7; --warn-bg:#ffedd5; --bad-bg:#fee2e2;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c23; --surface-2:#21262f;
  --fg:#eef1f5; --fg-dim:#9aa3b1; --fg-faint:#6d7684;
  --line:#2b313b; --line-soft:#232932;
  --accent:#6ea0f5;
  --push:#60a5fa; --pull:#34d399; --legs:#fb923c; --upper:#c084fc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --ok-bg:#14321f; --warn-bg:#3a2a10; --bad-bg:#3d1a1a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c23; --surface-2:#21262f;
  --fg:#eef1f5; --fg-dim:#9aa3b1; --fg-faint:#6d7684;
  --line:#2b313b; --line-soft:#232932;
  --accent:#6ea0f5;
  --push:#60a5fa; --pull:#34d399; --legs:#fb923c; --upper:#c084fc;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --ok-bg:#14321f; --warn-bg:#3a2a10; --bad-bg:#3d1a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:15px; line-height:1.45;
  margin:0; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
input{font:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.hrow{display:flex; align-items:center; gap:10px; padding:10px 16px 8px;}
.brand{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.2px; flex:1 1 auto; min-width:0}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--fg-faint);letter-spacing:.3px;text-transform:uppercase}
.sync{font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; background:var(--surface-2); color:var(--fg-dim); white-space:nowrap}
.sync.on{background:var(--ok-bg); color:var(--ok)}
.sync.off{background:var(--warn-bg); color:var(--warn)}

.days{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 16px 10px}
.day{
  border:1px solid var(--line); background:var(--surface); border-radius:9px;
  padding:7px 2px 8px; text-align:center; cursor:pointer; min-width:0;
}
.day b{display:block; font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:-.1px}
.day span{display:block; font-size:9.5px; font-weight:600; color:var(--fg-faint); letter-spacing:.5px; margin-top:1px}
.day.sel{border-color:var(--dc); background:var(--dc); color:#fff}
.day.sel span{color:rgba(255,255,255,.75)}
.day.done::after{content:"●"; font-size:7px; color:var(--ok); display:block; line-height:1; margin-top:2px}
.day.sel.done::after{color:#fff}

/* ---------- wrap ---------- */
main{padding:0 16px; padding-block:14px 108px; max-width:560px; margin:0 auto}
.sec{margin-bottom:14px}
.sect{
  font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--fg-faint); margin:0 0 7px 2px;
}

/* ---------- card ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.card + .card{margin-top:8px}

/* feedback */
.fb{padding:12px 13px}
.fbgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px}
.fbi{min-width:0}
.fbl{font-size:11px; font-weight:700; color:var(--fg-dim); margin-bottom:4px; letter-spacing:.2px}
.pick{display:flex; gap:3px}
.pick button{
  flex:1 1 0; min-width:0; border:1px solid var(--line); background:transparent;
  border-radius:6px; padding:6px 0; font-size:12.5px; font-weight:700; cursor:pointer;
  color:var(--fg-dim);
}
.pick button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.fbnote{font-size:11px; color:var(--fg-faint); margin-top:9px; line-height:1.4}

/* esercizio */
.ex{padding:11px 13px 12px; border-bottom:1px solid var(--line-soft)}
.ex:last-child{border-bottom:0}
.exh{display:flex; gap:9px; align-items:flex-start}
.num{
  flex:0 0 22px; height:22px; border-radius:6px; background:var(--dc); color:#fff;
  font-family:var(--display); font-weight:800; font-size:12px;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.exn{flex:1 1 auto; min-width:0}
.exname{font-weight:700; font-size:14.5px; line-height:1.25; letter-spacing:-.15px}
.pres{margin-top:3px; font-size:12.5px; color:var(--fg-dim); font-weight:600}
.pres b{color:var(--fg)}
.tag{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.4px; padding:1px 5px; border-radius:4px; margin-left:4px; vertical-align:1px}
.t-m{background:var(--fg); color:var(--bg)}
.t-new{background:var(--warn-bg); color:var(--warn)}
.t-r0{background:var(--ok-bg); color:var(--ok)}
.t-r1{background:var(--warn-bg); color:var(--warn)}
.t-r12{background:var(--bad-bg); color:var(--bad)}
.cue{margin-top:6px; font-size:12px; line-height:1.4; color:var(--fg-dim); background:var(--surface-2); padding:6px 8px; border-radius:7px}
.cue b{color:var(--fg)}
.cue.warn{background:var(--bad-bg); color:var(--bad)}
.cue.warn b{color:var(--bad)}

/* set rows */
.sets{margin-top:9px; display:flex; flex-direction:column; gap:6px}
.sr{display:flex; align-items:center; gap:6px}
.sl{flex:0 0 26px; font-size:10.5px; font-weight:700; color:var(--fg-faint); letter-spacing:.3px}
.fi{flex:1 1 0; min-width:0; position:relative}
.fi input{
  width:100%; border:1px solid var(--line); background:var(--bg); color:var(--fg);
  border-radius:8px; padding:9px 8px 9px 9px; font-size:16px; font-weight:600;
  font-variant-numeric:tabular-nums; -moz-appearance:textfield;
}
.fi input::-webkit-outer-spin-button,.fi input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fi input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.fi u{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  font-size:10.5px; font-weight:700; color:var(--fg-faint); text-decoration:none; pointer-events:none;
}
.prev{font-size:11px; color:var(--fg-faint); margin-top:4px; font-variant-numeric:tabular-nums}
.prev b{color:var(--fg-dim); font-weight:700}

.conn{display:flex; align-items:center; gap:7px; margin-top:9px}
.connl{font-size:11px; font-weight:700; color:var(--fg-dim)}
.conn .pick{flex:1 1 auto; max-width:180px}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--surface); border-top:1px solid var(--line);
  padding:10px 16px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.barin{max-width:560px; margin:0 auto; display:flex; gap:9px; align-items:center}
.save{
  flex:1 1 auto; border:0; background:var(--accent); color:#fff;
  font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:-.1px;
  border-radius:10px; padding:13px 10px; cursor:pointer;
}
.save:disabled{opacity:.45; cursor:default}
.save.done{background:var(--ok)}
.ghost{
  border:1px solid var(--line); background:transparent; border-radius:10px;
  padding:13px 14px; font-weight:700; font-size:13px; cursor:pointer; color:var(--fg-dim);
}
.msg{font-size:11.5px; color:var(--fg-faint); text-align:center; margin-top:6px; min-height:14px}
.msg.err{color:var(--bad); font-weight:600}

/* storico */
.hrow2{display:flex; justify-content:space-between; gap:10px; padding:9px 13px; border-bottom:1px solid var(--line-soft); align-items:baseline}
.hrow2:last-child{border-bottom:0}
.hd{font-size:12.5px; color:var(--fg-dim); font-weight:600; flex:0 0 auto}
.hv{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right; min-width:0}
.hv small{color:var(--fg-faint); font-weight:600}
.pill{display:inline-block; font-size:10px; font-weight:800; padding:1px 6px; border-radius:99px; margin-left:5px}

.empty{padding:26px 16px; text-align:center; color:var(--fg-faint); font-size:13px; line-height:1.55}
.empty b{display:block; color:var(--fg-dim); font-family:var(--display); font-size:15px; margin-bottom:5px}

.domsbox{background:var(--warn-bg); border:1px solid transparent; border-radius:12px; padding:12px 13px}
.domsbox .sect{color:var(--warn)}
.domsq{font-size:13px; font-weight:600; color:var(--warn); margin-bottom:9px; line-height:1.4}

.legend summary{padding:11px 13px; font-size:12.5px; font-weight:700; color:var(--fg-dim); cursor:pointer}
.legend dl{margin:0; padding:0 13px 12px; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; font-size:12px; line-height:1.4}
.legend dt{font-weight:700; white-space:nowrap}
.legend dt .tag{margin-left:0}
.legend dd{margin:0; color:var(--fg-dim)}
.note{margin-top:9px}
.note textarea{
  width:100%; min-height:38px; resize:none; overflow:hidden; display:block;
  border:1px dashed var(--line); background:transparent; color:var(--fg);
  border-radius:8px; padding:8px 9px; font:inherit; font-size:14px; line-height:1.4;
}
.note textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-style:solid; border-color:transparent; background:var(--bg)}
.note textarea::placeholder{color:var(--fg-faint)}
.timer{font-variant-numeric:tabular-nums; min-width:96px; white-space:nowrap}
.timer.run{border-color:var(--accent); color:var(--accent)}
.timer.end{color:var(--ok); border-color:var(--ok)}
.tabs{display:flex; gap:6px; padding:0 16px 10px}
.tab{flex:1 1 0; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 0; font-size:12.5px; font-weight:700; color:var(--fg-dim); cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- PWA: safe area, login ---------- */
body{padding-top:env(safe-area-inset-top,0px)}
.login{max-width:380px; margin:12vh auto 0; padding:0 16px}
.login h1{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.4px; margin:0 0 4px}
.login p{color:var(--fg-dim); font-size:13px; margin:0 0 18px}
.login label{display:block; font-size:11px; font-weight:700; color:var(--fg-dim); margin:12px 0 4px; letter-spacing:.2px}
.login input{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:9px; padding:11px 10px; font-size:16px}
.login input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
.login .save{width:100%; margin-top:18px}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:11.5px; color:var(--fg-faint); padding:4px 2px 0}
.foot button{border:0; background:none; color:var(--fg-dim); font-weight:700; font-size:12px; cursor:pointer; padding:6px 0}
</style>
</head>
<body>
<div id="app" hidden>
<header>
  <div class="hrow">
    <div class="brand">Rhino Log<small id="meso">Mesocycle 1 · Activation</small></div>
    <div class="sync" id="sync">connecting…</div>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-log" aria-pressed="true">Workout</button>
    <button class="tab" id="tab-hist" aria-pressed="false">History</button>
  </div>
  <div class="days" id="days"></div>
</header>

<main>
  <div id="view-log"></div>
  <div id="view-hist" hidden></div>
</main>

<div class="bar" id="bar">
  <div class="barin">
    <button class="ghost" id="btn-clear">Clear</button>
    <button class="ghost timer" id="btn-timer">▶ Start</button>
    <button class="save" id="btn-save">Save session</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
</div>

<form class="login" id="login" hidden>
  <h1>Rhino Log</h1>
  <p>Sign in once: this phone stays signed in.</p>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button class="save" type="submit" id="btn-login">Sign in</button>
  <div class="msg" id="lmsg"></div>
</form>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
"use strict";

/* ============ PROGRAM — plan v4.1, mesocycle 1 ============
   Keys (k) are database ids: never rename them, only the visible text. */
const DAYS = [
  {k:"push", label:"PUSH", sub:"MON", color:"var(--push)", warm:"Cable external rotations 2 × 12-15, light", ex:[
    {k:"pullover",  n:"Cable pullover (high pulley)", s:2, r:"10-15", rir:"0",   rest:"90s",  m:true, nw:true, cue:'"Superman": spread the shoulder blades, then pull them <b>down</b>'},
    {k:"peckfly",   n:"Pec deck fly",                 s:2, r:"8-12",  rir:"0",   rest:"90s",  cue:"Hands <b>never past</b> the torso line"},
    {k:"panca",     n:"Smith machine incline press, 20° bench", s:2, r:"6-10", rir:"1-2", rest:"2min"},
    {k:"crosslat",  n:"Cable cross lateral raise",    s:2, r:"10-15", rir:"0",   rest:"90s",  nw:true, cue:"<b>Stay below shoulder height.</b> Medium weight, no swinging"},
    {k:"lorenzo",   n:"Lorenzo press (triceps)",      s:2, r:"8-11",  rir:"0",   rest:"90s",  cue:"Triceps in the lengthened position"}
  ]},
  {k:"pull", label:"PULL", sub:"TUE", color:"var(--pull)", ex:[
    {k:"pullover",  n:"Cable pullover (high pulley)", s:2, r:"10-15", rir:"0", rest:"90s", m:true, nw:true, cue:'"Superman". Tempo <b>2-1-1</b>'},
    {k:"pulldown",  n:"Lat pulldown, overhand grip",  s:2, r:"8-12",  rir:"0", rest:"90s", m:true, nw:true, cue:"<b>Spread the shoulder blades without shrugging</b>, then drive the elbows out. Think rotation. Tempo 3-1-1"},
    {k:"csrow_v",   n:"Chest-supported row — neutral grip", s:2, r:"6-10", rir:"0", rest:"2min", nw:true, cue:"Neutral (vertical) grip, chest on the pad. This is the heavy back exercise"},
    {k:"tbar",      n:"Chest-supported T-bar row — overhand grip", s:2, r:"8-12", rir:"0", rest:"2min", nw:true, cue:"Chest on the pad. Overhand grip = rear delts"},
    {k:"scott",     n:"Preacher curl",                s:2, r:"8-12",  rir:"0", rest:"90s"},
    {k:"crunch",    n:"Cable crunch (high pulley)",   s:2, r:"10-15", rir:"0", rest:"60-90s", nw:true}
  ]},
  {k:"legs", label:"LEGS", sub:"THU", color:"var(--legs)", ex:[
    {k:"abduz",   n:"STANDING cable hip abduction", s:2, r:"10-15", rir:"1", rest:"superset", nw:true,
     cue:"Neutral hip · <b>toes turned slightly out</b> · short range, 30-40° · torso still", warn:"Cramp → end the set, lower the weight"},
    {k:"adduz",   n:"Hip adduction machine",        s:2, r:"10-15", rir:"1", rest:"90s", cue:"Chase the <b>feeling</b>, not the weight"},
    {k:"legext",  n:"Single-leg leg extension",     s:2, r:"8-12",  rir:"1", rest:"alternate legs", m:true, nw:true, uni:true,
     cue:"<b>Alternate L/R with no rest</b>"},
    {k:"legpress",n:"Single-leg horizontal leg press", s:2, r:"8-12", rir:"1-2", rest:"alternate + 45-60s", nw:true, uni:true,
     cue:"<b>Foot in line with the hip</b>, not centered · 3 s lowering · only the range you control"},
    {k:"hip",     n:"Hip thrust",                   s:2, r:"8-12",  rir:"1", rest:"2min", nw:true},
    {k:"stacchi", n:"Romanian deadlift",            s:2, r:"6-9",   rir:"1-2", rest:"2min"},
    {k:"legcurl", n:"Lying leg curl",               s:2, r:"7-10",  rir:"1", rest:"superset"},
    {k:"calf",    n:"Standing calf raise",          s:2, r:"7-11",  rir:"1", rest:"90s"}
  ]},
  {k:"upper", label:"UPPER", sub:"FRI", color:"var(--upper)", warm:"Cable external rotations 2 × 12-15, light", ex:[
    {k:"latuni",    n:"Single-arm lat pulldown",    s:2, r:"6-10",  rir:"0", rest:"2min", uni:true},
    {k:"csrow_o",   n:"Chest-supported row — overhand grip", s:2, r:"6-10", rir:"0", rest:"2min", cue:"Overhand, wide grip"},
    {k:"chestpress",n:"Cable chest press",          s:2, r:"8-12",  rir:"0", rest:"2min", nw:true,
     cue:"<b>Handles touch at the end</b>, even crossing over. Don't open too wide at the start"},
    {k:"lento",     n:"Smith machine shoulder press, 60-75° bench", s:2, r:"7-12", rir:"1-2", rest:"2min", cue:"If it hurts: shorten the range, or drop it"},
    {k:"alzate",    n:"Dumbbell lateral raise",     s:2, r:"10-15", rir:"0", rest:"90s", cue:"<b>No cheating.</b> Never above shoulder height"},
    {k:"pushdown",  n:"Cable triceps pushdown, 45° bench", s:2, r:"9-13", rir:"0", rest:"superset"},
    {k:"curl45",    n:"Incline dumbbell curl, 45° bench", s:2, r:"8-10", rir:"0", rest:"90s"}
  ]}
];
const FB = [["voglia","Motivation"],["mood","Mood"],["energia","Energy"],["rpe","RPE"]];
const KNEE = [["nulla","None"],["lieve","Mild"],["presente","Present"]];


/* ============ stato ============ */
let sb=null, online=false, sessions=[], curDay=defaultDay(), tab="log", draft=null, saving=false;

function defaultDay(){
  const w=new Date().getDay(); // 0 dom
  return ({1:"push",2:"pull",4:"legs",5:"upper"})[w] || "push";
}
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function dayDef(k){ return DAYS.find(d=>d.k===k); }
function sid(date,day){ return date+"-"+day; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtD(iso){ const [y,m,d]=iso.split("-"); return d+"/"+m; }
function blank(day){ return {date:today(), day, feedback:{}, sonno:{}, ginocchio:"", exercises:{}, doms:null, note:"", startedAt:null, endedAt:null}; }

/* Tre livelli in localStorage, tutti per-telefono:
   draft.<id>  la sessione in corso, salvata a ogni tasto
   outbox      sessioni salvate offline, in attesa di arrivare al database
   cache       l'ultimo storico scaricato, per aprire l'app senza rete */
const LS="rhinolog.draft.", OUTBOX="rhinolog.outbox", CACHE="rhinolog.cache";
function lsGet(k,fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function loadDraft(day){
  const id=sid(today(),day);
  const local=lsGet(LS+id,null); if(local) return local;
  const queued=lsGet(OUTBOX,{})[id]; if(queued) return JSON.parse(JSON.stringify(queued));
  const saved=sessions.find(s=>s.id===id);
  if(saved) return JSON.parse(JSON.stringify(saved.body));
  return blank(day);
}
function saveDraft(){ lsSet(LS+sid(draft.date,draft.day), draft); }
function dropDraft(day){ lsDel(LS+sid(today(),day)); }

/* ============ render ============ */
function renderDays(){
  const el=document.getElementById("days");
  el.innerHTML = DAYS.map(d=>{
    const done = sessions.some(s=>s.id===sid(today(),d.k));
    return `<button class="day${d.k===curDay?" sel":""}${done?" done":""}" data-day="${d.k}" style="--dc:${d.color}">
      <b>${d.label}</b><span>${d.sub}</span></button>`;
  }).join("");

function prevFor(day, exKey){
  const id=sid(today(),day);
  const past=sessions.filter(s=>s.body.day===day && s.id!==id);
  for(const s of past){ const e=s.body.exercises?.[exKey]; if(e&&e.sets?.some(x=>x&&(x.kg||x.reps))) return {date:s.body.date,e}; }
  return null;
}

function numIn(ex,s,f,unit,val){

}
function plainIn(path,ph,val){
  return `<div class="fi"><input type="number" inputmode="numeric" min="0" data-path="${path}" placeholder="${ph}" value="${val??""}"></div>`;
}

function wireLog(){
  const v=document.getElementById("view-log");

    i.oninput=()=>{
      const {ex,s,f}=i.dataset;
      draft.exercises[ex] = draft.exercises[ex] || {sets:[],conn:null};
      const arr=draft.exercises[ex].sets;
      arr[+s]=arr[+s]||{};
      arr[+s][f] = i.value===""?undefined:Number(i.value);
      saveDraft(); markDirty();
    };
  });
  v.querySelectorAll("textarea").forEach(ta=>{
    grow(ta);
    ta.oninput=()=>{
      grow(ta);
      if(ta.dataset.note){ const k=ta.dataset.note;
        draft.exercises[k]=draft.exercises[k]||{sets:[],conn:null}; draft.exercises[k].note=ta.value; }
      else draft.note=ta.value;
      saveDraft(); markDirty();
    };
  });
  v.querySelectorAll("input[data-path]").forEach(i=>{
    i.oninput=()=>{ const [a,b]=i.dataset.path.split("."); draft[a][b]= i.value===""?undefined:Number(i.value); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-fb] button").forEach(b=>{
    b.onclick=()=>{ const k=b.closest("[data-fb]").dataset.fb; draft.feedback[k]=+b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-conn] button").forEach(b=>{
    b.onclick=()=>{ const k=b.closest("[data-conn]").dataset.conn;
      draft.exercises[k]=draft.exercises[k]||{sets:[],conn:null}; draft.exercises[k].conn=+b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); saveDraft(); markDirty(); };
  });
  v.querySelectorAll("[data-gin] button").forEach(b=>{
    b.onclick=()=>{ draft.ginocchio=b.dataset.v;
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));

      const {error}=await sb.from("rhino_sessions").update({doms_grado:+b.dataset.doms, doms_at:today()}).eq("id",p.uuid);
      if(error) msg("DOMS not saved: "+(isNetErr(error)?"you are offline":error.message), true); else sync();
    };
  });
}

/* ============ database (Supabase) ============ */
const SEL="id,date,day,voglia,mood,energia,rpe,sonno_ore,risvegli,ginocchio,doms_grado,doms_at,deload,note,saved_at,started_at,ended_at,duration_min,"+
          "rhino_exercises(exercise,conn,note),rhino_sets(exercise,set_no,side,kg,reps)";

/* riga Supabase → stessa forma della sessione che usa l'interfaccia */
function fromRow(r){
  const ex={};
  const get=k=>ex[k]=ex[k]||{sets:[],conn:null};
  (r.rhino_exercises||[]).forEach(e=>{ const o=get(e.exercise); o.conn=e.conn; if(e.note) o.note=e.note; });
  (r.rhino_sets||[]).forEach(s=>{
    const o=get(s.exercise), i=s.set_no-1, z=o.sets[i]=o.sets[i]||{};
    const kg=s.kg==null?undefined:Number(s.kg), reps=s.reps==null?undefined:s.reps;
    if(s.side==="dx"){ z.kg2=kg; z.reps2=reps; } else { z.kg=kg; z.reps=reps; }
  });
  const nn=v=>v==null?undefined:Number(v);
  return {id:sid(r.date,r.day), uuid:r.id, body:{
    date:r.date, day:r.day,
    feedback:{voglia:nn(r.voglia), mood:nn(r.mood), energia:nn(r.energia), rpe:nn(r.rpe)},
    sonno:{ore:nn(r.sonno_ore), risvegli:nn(r.risvegli)},
    ginocchio:r.ginocchio||"", exercises:ex,
    doms:r.doms_grado==null?null:{grado:r.doms_grado, at:r.doms_at},
    deload:!!r.deload, note:r.note||"", savedAt:r.saved_at,
    startedAt:r.started_at||null, endedAt:r.ended_at||null, durationMin:r.duration_min==null?null:Number(r.duration_min)
  }};
}

/* negli unilaterali manda sempre kg2/reps2 (anche null): la funzione SQL distingue SX/DX così */
function toPayload(d){
  const p=JSON.parse(JSON.stringify(d));
  const def=dayDef(p.day);
  for(const [k,e] of Object.entries(p.exercises||{})){
    const uni=def.ex.find(x=>x.k===k)?.uni;
    e.sets=(e.sets||[]).map(z=>{
      z=z||{};
      const o={kg:z.kg??null, reps:z.reps??null};
      if(uni){ o.kg2=z.kg2??null; o.reps2=z.reps2??null; }
      return o;
    });
  }
  return p;
}

async function fetchSessions(){
  const {data,error}=await sb.from("rhino_sessions").select(SEL).order("date",{ascending:false}).limit(200);
  if(error) throw error;
  sessions=data.map(fromRow);
  lsSet(CACHE, sessions);
}

async function pushSession(body){
  const {error}=await sb.rpc("rhino_save_session",{p:toPayload(body)});
  if(error) throw error;
}

/* svuota la coda offline; ritorna quante sessioni restano */
async function flushOutbox(){
  const box=lsGet(OUTBOX,{});
  for(const [id,body] of Object.entries(box)){
    try{ await pushSession(body); delete box[id]; lsSet(OUTBOX,box); }
    catch(e){ if(isNetErr(e)) break; else { delete box[id]; lsSet(OUTBOX,box); msg("A queued session was rejected: "+(e.message||"error"), true); } }
  }
  return Object.keys(lsGet(OUTBOX,{})).length;
}

function isNetErr(e){
  const m=String(e&&(e.message||e)||"");
  return !navigator.onLine || /fetch|network|Load failed|timeout/i.test(m);
}

function setSync(state, extra){
  const sy=document.getElementById("sync");
  const q=Object.keys(lsGet(OUTBOX,{})).length;
  const txt={on:"synced", off:"offline", err:"error", wait:"connecting…"}[state];
  sy.textContent = txt + (q?` · ${q} queued`:"") + (extra||"");
  sy.className = "sync" + (state==="on"&&!q?" on":(state==="wait"?"":" off"));
}

async function sync(){
  if(!sb) return;
  try{
    await flushOutbox();
    await fetchSessions();
    online=true; setSync("on");
  }catch(e){
    online=false; setSync(isNetErr(e)?"off":"err");
  }
  const id=sid(today(),curDay);
  if(!lsGet(LS+id,null)) draft=loadDraft(curDay);
  render();
}

function filled(){
  return Object.values(draft.exercises).some(e=>e.conn || e.note?.trim() || e.sets?.some(s=>s&&(s.kg||s.reps)));
}
function markDirty(){ refreshSave(); }
function refreshSave(){
  const b=document.getElementById("btn-save");
  const id=sid(draft.date,draft.day);
  const saved = sessions.some(s=>s.id===id) || !!lsGet(OUTBOX,{})[id];
  b.disabled = saving || !filled();
  b.textContent = saving ? "Saving…" : (saved ? "Update session" : "Save session");
  b.classList.toggle("done", saved && !saving);
}
function msg(t,err){ const m=document.getElementById("msg"); m.textContent=t||""; m.classList.toggle("err",!!err); }

async function saveSession(){
  if(saving) return;
  saving=true; refreshSave(); msg("");
  const tm=getTimer();
  if(tm){ draft.startedAt=tm.start; draft.endedAt=tm.end||new Date().toISOString(); saveDraft(); }
  const body=JSON.parse(JSON.stringify(draft));
  body.savedAt=new Date().toISOString();
  const id=sid(body.date,body.day);
  try{
    await pushSession(body);
    dropDraft(body.day);
    msg("Saved to the database.");
    await sync();
  }catch(e){
    if(isNetErr(e)){
      const box=lsGet(OUTBOX,{}); box[id]=body; lsSet(OUTBOX,box);
      dropDraft(body.day);
      msg("You're offline: saved on this phone, it will upload by itself when you're back online.");
      setSync("off");
    }else{
      msg("Not saved ("+(e.message||"error")+"). Your data stays on this phone.", true);
    }
  }
  saving=false; refreshSave();
}
document.getElementById("btn-save").onclick=saveSession;

/* ---------- timer durata sessione ----------
   Stato in localStorage per sessione: {start, end}; end null = in corso. Sopravvive a chiusura app e salvataggi.
   Ogni salvataggio manda startedAt/endedAt (endedAt = adesso se il timer gira ancora); Finish lo ferma. */
const TIMER="rhinolog.timer.";
function getTimer(){
  const id=sid(draft.date,draft.day);
  const t=lsGet(TIMER+id,null); if(t) return t;
  return draft.startedAt ? {start:draft.startedAt, end:draft.endedAt} : null;
}
function setTimer(t){ const id=sid(draft.date,draft.day); if(t) lsSet(TIMER+id,t); else lsDel(TIMER+id); paintTimer(); }
function fmtDur(ms){
  const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0");
}
function paintTimer(){
  const b=document.getElementById("btn-timer"); if(!b) return;
  const t=draft&&getTimer();
  b.classList.toggle("run", !!(t&&!t.end)); b.classList.toggle("end", !!(t&&t.end));
  if(!t) b.textContent="▶ Start";
  else if(!t.end) b.textContent="⏱ "+fmtDur(Date.now()-new Date(t.start));
  else b.textContent="✓ "+Math.round((new Date(t.end)-new Date(t.start))/60000)+" min";
}
document.getElementById("btn-timer").onclick=async()=>{
  const t=getTimer();
  if(!t){ setTimer({start:new Date().toISOString(), end:null}); msg("Timer started. Tap it again when you finish."); return; }
  if(!t.end){
    if(!confirm("Finish the session? Total time: "+fmtDur(Date.now()-new Date(t.start)))) return;
    setTimer({start:t.start, end:new Date().toISOString()});
    if(filled()) await saveSession(); else msg("Time recorded. It will be saved with the session.");
    return;
  }
  if(confirm("Resume the timer? The time since you finished will count.")) setTimer({start:t.start, end:null});
};
setInterval(()=>{ if(tab==="log") paintTimer(); }, 1000);
document.getElementById("btn-clear").onclick=()=>{
  dropDraft(curDay);
  lsDel(TIMER+sid(today(),curDay));
  draft=blank(curDay);
  render(); msg("Cleared (on this phone only, the saved session is untouched).");

  draft=loadDraft(curDay);
  const cfg=window.RHINO_CONFIG;
  if(!cfg||!window.supabase){ showApp(); render(); setSync("err"," · config"); msg("Missing configuration (config.js).", true); return; }
  sb=window.supabase.createClient(cfg.url, cfg.anonKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"rhinolog.auth"}});
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  sbUserEmail=session.user?.email||"";
  showApp(); render(); setSync("wait");
  sync();
  window.addEventListener("online", sync);
  window.addEventListener("offline", ()=>setSync("off"));
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(); });
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
